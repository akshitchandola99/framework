# pytest.ini is a configuration file for pytest. It lets you define project-level settings
#so you don't have to pass the same options every time when you run pytest.

[pytest]
testpaths = tests
pythonpath = .
addopts = --html=reports/report.html --self-contained-html

# Log Levels : DEBUG -> INFO -> WARNING -> ERROR -> CRITICAL

log_cli = true
log_cli_level = INFO
log_cli_format = [%(asctime)s] [%(levelname)s] [%(name)s] [%(funcName)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = log/test.log
log_file_level = DEBUG
log_file_format = [%(asctime)s] [%(levelname)s] [%(name)s] [%(funcName)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
